---
layout: default
---
<p class="lede">{{ site.description }}</p>

{% if site.posts.size > 0 %}
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endif %}
